services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile.home
    image: vibe-trading-home:latest
    container_name: vibe-trading-bot
    init: true
    restart: unless-stopped
    env_file:
      - ../../.env.paper
    environment:
      APP_ENV: paper
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../paper_trading.log:/app/paper_trading.log
      - ../../data:/app/data
    command: ["python", "run_paper.py"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python run_paper.py' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  dashboard:
    build:
      context: ../..
      dockerfile: Dockerfile.home
    image: vibe-trading-home:latest
    container_name: vibe-trading-dashboard
    init: true
    restart: unless-stopped
    depends_on:
      - bot
    env_file:
      - ../../.env.paper
    environment:
      DASHBOARD_PORT: "8765"
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../../paper_trading.log:/app/paper_trading.log
    command: ["python", "log_dashboard.py"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

